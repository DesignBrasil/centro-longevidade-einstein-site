<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistemática Longevidade — relatório do Centro de Longevidade Einstein</title>
<meta name="description" content="Uma pessoa atravessa o sistema e o relatório anda com ela: a abertura, as quatro camadas (quem paga, o que o Centro mede e modula, o que entra em cada pacote, o que a pessoa vive) e a direção.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav>
  <div class="wrap nav-inner">
    <a class="brand" href="index.html"><img class="brand-selo" src="img/selo_sistematica.svg" alt=""><span>Sistemática<small>Longevidade</small></span></a>
    <div class="nav-links" id="camadas" role="tablist" aria-label="as quatro camadas"></div>
    <a class="nav-irma" href="../">
      <img src="../img/buraco_minhoca_nav.png" alt=""><span>Longevidade <b>Einstein</b></span></a>
  </div>
</nav>

<main class="wrap palco">
  <p class="pergunta" id="pergunta"></p>
  <!-- a frase-título da camada: a conclusão dela, antes do desenho -->
  <p class="manchete" id="manchete"></p>

  <div class="vistas">
    <!-- 0 · ABERTURA: à esquerda, o portal do site (a travessia animada:
         M¹ medir, M² mapear, M³ modular); à direita, a capa em sete perguntas -->
    <section class="vista v-dupla v-abertura" id="v-abertura" role="tabpanel" aria-label="Abertura">
      <div class="cena-rolo">
        <div class="abre-portal" id="abre-portal" role="img" aria-label="A travessia: medir, mapear, modular">
          <canvas id="abre-warp"></canvas>
          <div class="pi-selo">
            <div class="pi-mapa">
              <img src="../img/buraco_minhoca_claro.png" alt="">
              <button class="pi-m pi-m1" data-passo="0">M¹ medir</button>
              <button class="pi-m pi-m2" data-passo="1">M² mapear</button>
              <button class="pi-m pi-m3" data-passo="2">M³ modular</button>
            </div>
            <p class="pi-nome">Centro de Longevidade <strong>Einstein</strong></p>
          </div>
        </div>
      </div>
      <aside class="leitura" id="leitura-abre" aria-live="polite" data-cresce="1.45"></aside>
    </section>

    <section class="vista v-dupla" id="v-ecossistema" role="tabpanel" aria-label="Ecossistema">
      <div class="cena-rolo">
        <svg id="eco" viewBox="0 44 945 546" role="img" aria-label="O ecossistema: os atores internos e externos, e as relações de dinheiro entre eles"></svg>
      </div>
      <aside class="leitura" id="leitura-eco" aria-live="polite" data-cresce="1.4"></aside>
    </section>

    <section class="vista v-dupla" id="v-sistema" role="tabpanel" aria-label="Sistema">
      <div class="cena-rolo">
        <svg id="cena" viewBox="0 0 480 720" role="img" aria-label="O sistema: o funil do Centro, com cada item no seu movimento — M1 medir, M2 mapear, M3 modular"></svg>
      </div>
      <aside class="leitura" id="leitura-sis" aria-live="polite" data-cresce="1.4"></aside>
    </section>

    <section class="vista" id="v-servicos" role="tabpanel" aria-label="Serviços">
      <!-- data-cresce: este painel pode ampliar até 1,8× para ocupar a altura
           livre — é o que mantém a letra dos exames legível em tela grande -->
      <div class="cartoes" id="cartoes" data-cresce="1.8"></div>
    </section>

    <section class="vista v-jornadas" id="v-jornadas" role="tabpanel" aria-label="Jornadas">
      <aside class="lista-jor" id="lista-jor"></aside>
      <div class="jor-palco" id="jor-palco" data-cresce="1.4"></div>
    </section>

    <!-- 5 · DIREÇÃO: o que encontramos, o que está aberto, o que vem a seguir -->
    <section class="vista v-direcao" id="v-direcao" role="tabpanel" aria-label="Direção">
      <div class="direcao" id="direcao" data-cresce="1.25" data-piso="0.54"></div>
    </section>
  </div>
  <!-- a faixa de baixo: o que a camada revela (e onde se mexe) + a próxima camada.
       Em cima, a pergunta; no meio, o desenho; embaixo, o que ele revela. -->
  <p class="revela" id="revela"></p>
</main>

<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
